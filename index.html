<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Turnos y Citas</title>
    <!-- Aplica el tema guardado ANTES de pintar, para que no parpadee (claro -> oscuro).
         La misma lógica está en src/lib/tema.ts; aquí va mínima y en JS plano. -->
    <script>
      (function () {
        try {
          var t = JSON.parse(localStorage.getItem("tema") || "{}");
          var oscuro =
            t.modo === "oscuro" ||
            ((t.modo || "sistema") === "sistema" &&
              matchMedia("(prefers-color-scheme: dark)").matches);
          var d = document.documentElement;
          d.dataset.theme = oscuro ? "colegio-oscuro" : "colegio";
          if (t.marca) d.dataset.marca = t.marca;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
